<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}nParity{% endblock %}</title>
<link rel="stylesheet" href="/static/nparity.css">
<script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">nParity<span>did we break anything?</span></div>
    <nav class="views">
      <a href="/" class="{{ 'active' if nav == 'runs' }}">Runs</a>
      {% if run %}
      <a href="/runs/{{ run.id }}" class="{{ 'active' if nav == 'run' }}">Run</a>
      <a href="/runs/{{ run.id }}/mapping" class="{{ 'active' if nav == 'mapping' }}">Mapping</a>
      {% endif %}
    </nav>
  </div>
</header>
<main class="wrap">
{% block content %}{% endblock %}
</main>
</body>
</html>
