# Evaluator spec section 3. Bump `version` on any change: it is part of the cache key and the threshold lookup.
id: fireworks/deepseek-v4p1-flash-1017-us
version: 1
backend: logprob_chat
provider:
  base_url: https://us.api.fireworks.ai/inference/v1
  path: /chat/completions
  api_key_env: FIREWORKS_API_KEY
  model: accounts/fireworks/routers/deepseek-v4p1-flash-1017-us   # only the -us router is allowed (403 otherwise)
request:
  temperature: 0
  max_tokens: 1
  logprobs: true
  top_logprobs: 5
  extra:
    reasoning_effort: none        # mandatory: "minimal" and "low" still reason, and then there is no answer token
limits:
  top_logprobs_max: 5
  calibrated_options: 5
  max_options: 30
  concurrency: 8
  timeout_s: 30
reason:
  max_tokens: 60
price:
  input_per_mtok_usd: null        # fill from the Fireworks pricing page
  cached_input_per_mtok_usd: null
  output_per_mtok_usd: null
  per_call_usd_estimate: 0.0000734   # measured in logprobs_report.md E11, used while prices are null
