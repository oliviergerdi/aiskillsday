# Flow answer key, format v1 (PRD 0005 #9). DRAFT v2 (26 Nov 2026).
# Vendor operations only. No internal code, identifiers or data.
# Checked against: ComplyAdvantage Mesh API FAQs and docs, CSOM API docs (docs.complyadvantage.com/api-docs).
# NOT yet confirmed by an engineer: the old-to-new pairing is a judgement. Do not score a run until `confirmed_by` is filled.
version: 1
old: {name: "CSOM (ComplyAdvantage searches API)", auth: "header Authorization: Token <key>"}
new: {name: "Mesh (ComplyAdvantage v2)",           auth: "access token from POST /v2/token"}
confirmed_by: null          # TO FILL: engineer who knows both sides
# evidence: used = called by our integration | docs = in the vendor docs only
# verified (vendor docs): Mesh has a SYNC create-and-screen (blocks until `last_sync_step`; ALERTING returns alert ids)
#   and an ASYNC one (returns workflow_instance_identifier; WORKFLOW_COMPLETED webhook or poll). Hits are a second call: GET /v2/alerts/{id}/risks.
#   CSOM POST /searches returns the first 100 hits in the response; more via GET /searches/{ref}/entities/{provider}.
# roles: direct | auth | configure | start | await | read | page | none
# `variants`: any one listed path counts as correct.
flows:
  - id: F1
    old_op: "POST /searches"
    intent: "Screen a person or company and get the hits"
    evidence: used
    variants:
      - name: sync            # the path in use
        steps:
          - {new_op: "POST /v2/token",                              role: auth}
          - {new_op: "GET /v2/entity-screening/configurations",     role: configure, note: "replaces the portal search profile"}
          - {new_op: "POST /v2/workflows/sync/create-and-screen",   role: start,     note: "last_sync_step=ALERTING returns alert ids"}
          - {new_op: "GET /v2/alerts/{id}/risks",                   role: page}
      - name: async           # documented alternative
        steps:
          - {new_op: "POST /v2/token",                              role: auth}
          - {new_op: "GET /v2/entity-screening/configurations",     role: configure}
          - {new_op: "POST /v2/workflows/create-and-screen",        role: start}
          - {new_op: "webhook WORKFLOW_COMPLETED",                  role: await, alt: "GET /v2/workflows/{id}"}
          - {new_op: "GET /v2/customers/{id}/cases",                role: read}
          - {new_op: "GET /v2/cases/{id}/alerts",                   role: read}
          - {new_op: "GET /v2/alerts/{id}/risks",                   role: page}
    confidence: check

  - id: F2
    old_op: "GET /searches/{id}/details"
    intent: "Read the hits of an existing screening"
    evidence: used
    steps:
      - {new_op: "GET /v2/customers/external/{external_identifier}", role: read, note: "find the customer"}
      - {new_op: "GET /v2/customers/{id}/cases",                     role: read}
      - {new_op: "GET /v2/cases/{id}/alerts",                        role: read}
      - {new_op: "GET /v2/alerts/{id}/risks",                        role: page}
    confidence: check

  - id: F3
    old_op: "GET /searches/{id}"
    intent: "Read the screening summary"
    evidence: used
    steps:
      - {new_op: "GET /v2/customers/external/{external_identifier}", role: direct}
    confidence: check

  - id: F4
    old_op: "PATCH /searches/{id}"
    intent: "Change the screened details and screen again"
    evidence: used
    steps:
      - {new_op: "POST /v2/customers/{id}/workflows/sync/update-and-rescore", role: start, note: "then read as F2"}
    confidence: check

  - id: F5
    old_op: "GET /searches/{id}/monitors"
    intent: "Read the ongoing monitoring state"
    evidence: used
    steps:
      - {new_op: "GET /v2/customers/{id}/monitor", role: direct}
    confidence: check

  - id: F6
    old_op: "PATCH /searches/{id}/monitors"
    intent: "Switch ongoing monitoring on or off"
    evidence: used
    steps:
      - {new_op: "PATCH /v2/customers/{id}/monitor", role: direct}
    confidence: check

  - id: F7
    old_op: "DELETE /searches/{id}"
    intent: "Remove the screening"
    evidence: used
    steps:
      - {new_op: "PATCH /v2/customers/{id}/monitor", role: direct, note: "partial: turns monitoring off, the customer record stays"}
    confidence: check

  - id: F8
    old_op: "GET /searches/{ref}/entities/{entity_provider}"
    intent: "Read hits beyond the first 100"
    evidence: docs
    steps:
      - {new_op: "GET /v2/alerts/{id}/risks", role: page, note: "paged with page_number and page_size"}
    confidence: check

  - id: F9
    old_op: "PATCH /searches/{id}/entities"
    intent: "Record a decision on a hit (true or false match)"
    evidence: docs
    steps:
      - {new_op: "POST /v2/alerts/{id}/risks/{id}/decision", role: direct}
    confidence: check

  - id: F10
    old_op: "PATCH /searches/{id}/search-profile"
    intent: "Change which screening settings apply"
    evidence: docs
    steps:
      - {new_op: "PATCH /v2/customers/{id}/monitor", role: direct, note: "sets the configuration identifier. TO CONFIRM"}
    confidence: check

unmatched_old:
  - {op: "GET /searches",                           note: "list all searches. No list-all call on the new side that we found"}
  - {op: "GET /searches/{id}/monitor/differences",  note: "TO CONFIRM: new side may use CASE_ALERT_LIST_UPDATED webhooks"}
  - {op: "POST /searches/{id}/monitor/acknowledge", note: "TO CONFIRM: new side may use CASE_TRANSITIONED and risk decisions"}
unmatched_new:
  - {op: "POST /v2/customers/{id}/workflows/sync/rescreen", note: "re-screen on demand"}
  - {op: "GET /v2/audit/customers/{id}",                    note: "audit log"}
  - {op: "PUT /v2/entity-screening/configurations/{id}",    note: "edit a screening configuration through the API"}
  - {op: "POST /v2/batch-processing",                       note: "batch"}
  - {op: "GET /v2/cases",                                   note: "list cases"}
