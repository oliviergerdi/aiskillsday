version: 1
flows:
  - old_op: POST /screenings
    steps:
      - {new_op: POST /token, role: auth}
      - {new_op: GET /screening-configurations, role: configure}
      - {new_op: POST /screening-jobs, role: start}
      - {new_op: 'callback screeningCompleted (POST /screening-jobs)', role: await}
      - {new_op: 'GET /screening-results/{resultId}', role: read}
      - {new_op: 'GET /screening-results/{resultId}/pages/{pageId}', role: page}
  - old_op: GET /health
    steps:
      - {new_op: GET /health, role: direct}
unmatched_old: [GET /legacy-screening-statistics]
unmatched_new: [GET /service-metrics]
